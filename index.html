<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi GitHub Pages</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 50px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,.12);
            text-align: center;
            max-width: 600px;
        }

        h1 {
            color: #0366d6;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            text-decoration: none;
            background: #0366d6;
            color: white;
            padding: 12px 28px;
            border-radius: 8px;
            transition: .3s;
        }

        a:hover {
            background: #024ea2;
        }

        footer {
            margin-top: 30px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>🚀 ¡GitHub Pages funciona!</h1>

    <p>
        Esta es una página de ejemplo publicada mediante
        <strong>GitHub Pages</strong>.
    </p>

    <a href="https://github.com" target="_blank">
        Visitar GitHub
    </a>

    <footer>
        © 2026 · Mi primera web en GitHub Pages
    </footer>

</div>

</body>
</html>
